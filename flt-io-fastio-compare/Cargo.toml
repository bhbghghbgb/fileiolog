[package]
name = "flt-io-fastio-compare"
version = "0.1.0"
edition = "2024"

[dependencies]
ferrisetw = { git = "https://github.com/n4r1b/ferrisetw", rev = "22caa099ea57a295b0e4cf91a741771bfde6bc0d", features = ["time_rs"] }
log = "0.4.33"
once_cell = "1.14"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fileiolog = { path = ".." }
etw-macros = { path = "../etw-macros" }
fileio-events-macro = { path = "../fileio-trace-test/fileio-events-macro" }

# Must match ferrisetw's internal windows crate version exactly (0.61.3).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Etw",
] }

[build-dependencies]
winres = "0.1"